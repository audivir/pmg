name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      # add mypy to path
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: j178/prek-action@v3.0.0
  tests:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      # the test of the zsh completion runs it in zsh, which the Linux runners lack
      - if: runner.os == 'Linux'
        run: sudo apt-get install --yes --no-install-recommends zsh
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev --python ${{ matrix.python-version }}
      - run: uv run coverage run -m pytest
        env:
          PMG_GH_TOKEN: ${{ github.token }}
      - run: uv run coverage combine || true
      - run: uv run coverage report
  specs:
    # the specs of pmg-specs against this pmg and its schema, which their own CI only checks on
    # their pushes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: audivir/pmg-specs
          path: pmg-specs
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run python -m pmg validate pmg-specs/specs/*.toml
      - run: |
          sed -i "s|^#:schema .*|#:schema file://$PWD/schema.json|" pmg-specs/specs/*.toml
          uvx --from taplo taplo check pmg-specs/specs/*.toml
