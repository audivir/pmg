# statically linked, so the same build runs on glibc and musl hosts
platforms = ["glibc_x64", "glibc_arm64", "musl_x64", "musl_arm64"]
bin = { patchelf = "bin/patchelf" }
man = ["share/man/man1/patchelf.1"]
completions.patchelf = { zsh = "share/zsh/site-functions/_patchelf" }
check = {}

[external]
brew = "patchelf"
apt = "patchelf"
apk = "patchelf"

[release]
type = "github"
repo = "NixOS/patchelf"

[download]
type = "github"

[assets]
glibc_x64 = "patchelf-{{ version }}-x86_64.tar.gz"
glibc_arm64 = "patchelf-{{ version }}-aarch64.tar.gz"
musl_x64 = "patchelf-{{ version }}-x86_64.tar.gz"
musl_arm64 = "patchelf-{{ version }}-aarch64.tar.gz"
